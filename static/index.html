<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Constellarium</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="shell.css">
</head>
<body>

<!-- Sign in (main password) -->
<div class="loginwrap" id="login" hidden>
  <form class="logincard" id="loginForm" autocomplete="on">
    <div class="bigmark">&#10022;</div>
    <h1>Constellarium</h1>
    <p class="muted">Private. Enter your password to continue.</p>
    <div class="pwfield">
      <input type="password" name="password" id="loginPw" autocomplete="current-password" placeholder="Password" required aria-label="Password">
      <button type="button" class="eyebtn" data-eye="loginPw" aria-label="Show or hide what I typed" title="Show / hide what I typed"></button>
    </div>
    <div class="errline" id="loginErr" role="alert"></div>
    <button type="submit" class="primary" id="loginGo">Unlock</button>
  </form>
</div>

<!-- The app (after sign in) -->
<div id="app" hidden>
  <header class="bar">
    <a class="brand" href="#home" title="Home"><span class="logo">&#10022;</span> Constellarium</a>
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <div class="spacer"></div>
    <button class="ghost" id="btnLogout" title="Sign out of Constellarium">Log out</button>
  </header>
  <main id="view"></main>
</div>

<dialog id="taskDlg">
  <form method="dialog" class="form" id="taskForm">
    <h3 id="taskDlgTitle">Task</h3>
    <label>Task<input type="text" name="title" maxlength="300" required autocomplete="off"></label>
    <label>Notes (optional)<textarea name="notes" rows="3" maxlength="5000"></textarea></label>
    <div class="row2">
      <label>Due (optional)<input type="date" name="due"></label>
      <label>Priority<select name="priority"><option value="normal">Normal</option><option value="high">High</option></select></label>
    </div>
    <label>Linked idea / problem (optional)
      <input type="search" id="linkSearch" placeholder="Search IdeaBank and ProblemBank…" autocomplete="off">
    </label>
    <div id="linkChosen" class="small"></div>
    <div class="picker" id="linkList" hidden></div>
    <div class="errline" id="taskErr" role="alert"></div>
    <div class="dlg-actions"><button type="button" class="danger" id="taskDelete" hidden>Delete</button><div class="spacer"></div><button type="button" id="taskCancel">Cancel</button><button type="submit" class="primary">Save</button></div>
  </form>
</dialog>

<dialog id="entryDlg">
  <form method="dialog" class="form" id="entryForm" autocomplete="off">
    <h3 id="entryDlgTitle">Password</h3>
    <label>Name (site or app)<input type="text" name="name" maxlength="120" required autocomplete="off"></label>
    <div class="row2">
      <label>Username / email<input type="text" name="username" maxlength="200" autocomplete="off"></label>
      <label>Website (optional)<input type="text" name="url" maxlength="300" placeholder="https://" autocomplete="off"></label>
    </div>
    <label>Password
      <div class="pwfield"><input type="password" name="password" id="entryPw" maxlength="1000" autocomplete="new-password" spellcheck="false"><button type="button" class="eyebtn" data-eye="entryPw" aria-label="Show or hide" title="Show / hide"></button></div>
    </label>
    <div><button type="button" id="entryGen" class="ghost">Generate a strong password</button></div>
    <label>Notes (encrypted too)<textarea name="notes" rows="3" maxlength="5000" autocomplete="off"></textarea></label>
    <div class="errline" id="entryErr" role="alert"></div>
    <div class="dlg-actions"><div class="spacer"></div><button type="button" id="entryCancel">Cancel</button><button type="submit" class="primary" id="entrySave">Save</button></div>
  </form>
</dialog>

<div id="toast" hidden></div>
<script src="shell.js"></script>
<script src="todo.js"></script>
<script src="vault.js"></script>
<script src="hub.js"></script>
<script src="ping.js"></script>
</body>
</html>
